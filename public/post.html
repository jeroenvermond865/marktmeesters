<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Handelspost · Marktmeesters</title>
  <link rel="stylesheet" href="/post.css">
  <link id="thema" rel="stylesheet" href="/thema.css">
</head>
<body>
  <main>
    <div class="topbalk">
      <a class="back" href="/">← Alle posten</a>
      <span class="verbinding" id="verbinding">Verbinden…</span>
    </div>

    <p class="eyebrow" id="subtitel">MARKTMEESTERS</p>
    <h1 id="titel">Handelspost</h1>

    <section class="nieuwsbalk" id="onbekend" hidden>
      Er bestaat geen post met de naam <b id="onbekendNaam"></b>. Misschien is hij hernoemd of verwijderd in de spelinstellingen.
      <a class="back" href="/">Kies een post →</a>
    </section>

    <div id="inhoud" hidden>
    <div class="speelbalk" id="speelbalk"></div>

    <section class="koerskaart">
      <span>Actuele koers<small id="voorraad"></small></span>
      <strong id="koers">€ –</strong>
    </section>

    <section class="nieuwsbalk" id="nieuwsbalk"></section>

    <div class="indeling">
      <section class="transactiekaart">
        <div class="keuze twee" id="modusKnoppen">
          <button type="button" class="keuzeknop actief" data-modus="handel">Handel</button>
          <button type="button" class="keuzeknop" data-modus="bonus">Beloning / boete</button>
        </div>

        <div class="keuze" id="groepKnoppen"></div>

        <!-- Handel -->
        <div class="modus" data-voor="handel">
          <div class="keuze twee">
            <button type="button" class="keuzeknop actief" data-actie="buy">Kopen</button>
            <button type="button" class="keuzeknop" data-actie="sell">Verkopen</button>
          </div>

          <label>
            Aandeel
            <select id="aandeel"></select>
          </label>

          <label>
            Aantal aandelen
            <div class="aantal">
              <button type="button" class="klein" data-stap="-1">−</button>
              <input id="aantal" type="number" min="1" value="1" inputmode="numeric">
              <button type="button" class="klein" data-stap="1">+</button>
            </div>
          </label>

          <p class="samenvatting" id="samenvatting"></p>
          <button id="verwerk">Verwerk transactie</button>
        </div>

        <!-- Beloning of boete -->
        <div class="modus" data-voor="bonus" hidden>
          <div class="keuze twee">
            <button type="button" class="keuzeknop actief" data-bonus="plus">🏅 Beloning</button>
            <button type="button" class="keuzeknop" data-bonus="min">⚠️ Boete</button>
          </div>
          <label>
            Bedrag (€)
            <input id="bonusBedrag" type="number" min="1" step="1" value="50" inputmode="numeric">
          </label>
          <div class="snelkeuze" id="bonusSnel">
            <button type="button" data-bedrag="25">25</button>
            <button type="button" data-bedrag="50">50</button>
            <button type="button" data-bedrag="100">100</button>
            <button type="button" data-bedrag="200">200</button>
          </div>
          <label>
            Reden
            <input id="bonusReden" maxlength="80" placeholder="Bijv. 'Toren gebouwd' of 'Te laat terug'">
          </label>
          <p class="samenvatting" id="bonusSamenvatting"></p>
          <button id="bonusKnop">Geef beloning</button>
        </div>

        <p class="melding" id="melding"></p>
      </section>

      <section>
        <h2>Groepen</h2>
        <p class="uitleg">Actueel kasgeld en aandelenbezit.</p>
        <div id="groepen" class="groepen"></div>
      </section>
    </div>
    </div>
  </main>

  <script src="/post.js"></script>
</body>
</html>
